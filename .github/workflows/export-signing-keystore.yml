name: Export signing keystore (encrypted backup)

# --------------------------------------------------------------------------
# 这是"手动触发"的应急工作流：把 GitHub Secrets 里的签名密钥还原出来，
# 用你自己设的口令加密，再作为 artifact 上传。
#
# 为什么需要它：
#   GitHub Secrets 只能写、不能读。本机上的密钥副本已经丢了（见交接文档第九节），
#   也就是说这份密钥目前只存在于 Secrets 里，一旦被误删/改动，
#   已发布的 App 就永远无法推送更新（Android 不允许换签名的包覆盖安装）。
#   本工作流是目前唯一能把副本取回来的途径。
#
# 用法：
#   1. 仓库 → Actions → 左侧选本工作流 → Run workflow
#   2. 填一个你自己想的加密口令（不要复用 GitHub 密码，
#      也绝对不要记在这个仓库里 —— 要记在仓库之外的地方）
#   3. 跑完到该 run 页面底部下载 artifact
#   4. 立刻存到网盘/电脑，并确认口令记牢
#
#   ⚠️ 口令丢了，备份等于没有。artifact 默认 7 天过期，请及时下载。
#
# 安全性说明：
#   * 只手动触发，PR / push 都不会跑它，别人无法借它拿到密钥；
#   * artifact 需要登录且有仓库权限才能下载，内容还经过 AES-256 加密；
#   * 密钥口令不会打印到日志里（下面有 ::add-mask:: 和刻意的不输出）。
# --------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: "加密口令（自己定，务必记牢；丢了备份就废了）"
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Check signing secret
        run: |
          if [ -z "${{ secrets.ALPHA_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ALPHA_KEYSTORE_BASE64 为空，没有可导出的密钥。"
            exit 1
          fi
          echo "已检测到密钥，开始导出。"

      - name: Mask passphrase in logs
        # 走 env 而不是直接插进脚本：口令里若有引号/反引号/$ 也不会破坏命令
        env:
          PASSPHRASE: ${{ inputs.passphrase }}
        run: echo "::add-mask::$PASSPHRASE"

      - name: Set up JDK 21
        # 只是为了拿到 keytool 来打印证书指纹（用它和已发布 APK 的签名核对）。
        # 不显式装的话，指纹那一步可能因为 runner 上没 JDK 而悄悄降级。
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Restore keystore from secrets
        env:
          KS_B64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > release.jks
          ls -l release.jks

      - name: Write recovery notes
        env:
          KS_PASS: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          # 注意：这份说明文件里有口令，**绝对不要 cat 到日志**。
          {
            echo "哔哩下载器 · 签名密钥恢复说明"
            echo "导出时间（UTC）: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "== 文件 =="
            echo "release.jks              密钥库本体"
            echo
            echo "== 口令信息 =="
            echo "ALPHA_KEYSTORE_PASSWORD = $KS_PASS"
            echo "ALPHA_KEY_ALIAS         = $KEY_ALIAS"
            echo "ALPHA_KEY_PASSWORD      = $KEY_PASS"
            echo
            echo "== 证书指纹（可与已发布 APK 的签名核对）=="
            keytool -list -v -keystore release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" 2>/dev/null \
              | grep -E "SHA1:|SHA256:" || echo "（读取失败，请用上面的口令手动核对）"
            echo
            echo "== 怎么恢复回 GitHub Secrets =="
            echo "base64 -w0 release.jks"
            echo "把输出填进 ALPHA_KEYSTORE_BASE64，其余三项照上面填。"
            echo
            echo "== 怎么解压这份备份 =="
            echo "openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \\"
            echo "  -in BiliDownloader-keystore-backup.tar.gz.enc \\"
            echo "  -out backup.tar.gz -pass pass:<你设的口令>"
            echo "tar -xzf backup.tar.gz"
          } > "密钥库信息-务必妥善保管.txt"

          echo "说明文件已生成，共 $(wc -c < "密钥库信息-务必妥善保管.txt") 字节（内容不打印）。"

          # 下面这两个指纹是**公开信息**（每个已发布的 APK 里都带着这张证书），
          # 所以特意打到日志里：这样你不解密 artifact 也能核对
          # "Secrets 里这份密钥" 是否就是给已发布 APK 签名的那个。
          echo "--- 证书指纹（公开信息，供与已发布 APK 核对）---"
          keytool -list -v -keystore release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -E "SHA1:|SHA256:" || echo "（读取失败，请用上面的口令手动核对）"

      - name: Pack and encrypt
        env:
          PASSPHRASE: ${{ inputs.passphrase }}
        run: |
          tar -czf backup.tar.gz release.jks "密钥库信息-务必妥善保管.txt"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in backup.tar.gz \
            -out BiliDownloader-keystore-backup.tar.gz.enc \
            -pass env:PASSPHRASE
          echo "加密包大小：$(wc -c < BiliDownloader-keystore-backup.tar.gz.enc) 字节"
          echo "SHA256（可记录，用于日后校验下载是否完整）："
          sha256sum BiliDownloader-keystore-backup.tar.gz.enc

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: BiliDownloader-keystore-backup-encrypted
          path: BiliDownloader-keystore-backup.tar.gz.enc
          retention-days: 7
          if-no-files-found: error
